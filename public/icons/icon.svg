<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AAAB3"/>
      <stop offset="100%" stop-color="#73BFC7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Rear wheel -->
  <circle cx="150" cy="340" r="100" stroke="white" stroke-width="28" fill="none"/>
  <!-- Front wheel -->
  <circle cx="362" cy="340" r="100" stroke="white" stroke-width="28" fill="none"/>

  <!-- Frame: rear axle to bottom bracket -->
  <line x1="150" y1="340" x2="256" y2="160" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <!-- Frame: bottom bracket to front axle -->
  <line x1="256" y1="160" x2="362" y2="340" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <!-- Down tube: head tube to bottom bracket -->
  <line x1="256" y1="160" x2="290" y2="340" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="256" y1="160" x2="340" y2="160" stroke="white" stroke-width="20" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="340" y1="160" x2="340" y2="112" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="304" y1="112" x2="378" y2="112" stroke="white" stroke-width="26" stroke-linecap="round"/>
  <!-- Seat post -->
  <line x1="256" y1="160" x2="210" y2="115" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="172" y1="112" x2="240" y2="112" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Crank ring -->
  <circle cx="290" cy="340" r="38" stroke="white" stroke-width="22" fill="none"/>
  <!-- Pedal center dot -->
  <circle cx="290" cy="340" r="14" fill="white"/>
</svg>