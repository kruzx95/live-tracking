<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square with teal gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AAAB3"/>
      <stop offset="100%" stop-color="#73BFC7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2B654F"/>
      <stop offset="100%" stop-color="#3A8A6A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Rear wheel -->
  <circle cx="18" cy="42" r="11" stroke="white" stroke-width="3" fill="none"/>
  <!-- Front wheel -->
  <circle cx="46" cy="42" r="11" stroke="white" stroke-width="3" fill="none"/>

  <!-- Frame: seat stay + chain stay -->
  <line x1="18" y1="42" x2="30" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="22" x2="46" y2="42" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Down tube -->
  <line x1="30" y1="22" x2="36" y2="42" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top tube -->
  <line x1="30" y1="22" x2="42" y2="22" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="42" y1="22" x2="42" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Handlebar bar -->
  <line x1="38" y1="16" x2="47" y2="16" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat post -->
  <line x1="30" y1="22" x2="25" y2="17" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="21" y1="17" x2="29" y2="17" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Pedal crank circle -->
  <circle cx="36" cy="42" r="4" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Pedal dot -->
  <circle cx="36" cy="42" r="1.5" fill="white"/>
</svg>